name: Publish Baby Zelda
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check game.mjs && node --test tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - name: Package only game files
        run: |
          mkdir public
          cp index.html style.css game.mjs core.mjs icon.svg .nojekyll public/
          cp -R assets public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: test-and-package
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
